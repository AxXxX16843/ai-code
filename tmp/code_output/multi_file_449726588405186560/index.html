<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>巅峰 · 登山包</title>
</head>
<body>
  <main class="product-card">
    <section class="product-gallery" aria-label="登山包展示">
      <img src="https://picsum.photos/seed/alpine/600/700" alt="专业登山背包正面视角" class="hero-img">
      <div class="badge">-20% 限时</div>
    </section>

    <section class="product-info">
      <h1 class="product-title">巅峰·探险家 45L</h1>
      <p class="subtitle">轻量透气 · 全天候背负</p>
      <p class="description">采用防撕裂尼龙与铝合金框架，通风背板设计，适合多日徒步。可调节胸带、腰带，搭配多个防水拉链仓，从容应对复杂地形。</p>
      
      <ul class="feature-list">
        <li>🔹 45L 容量 / 1.8kg</li>
        <li>🔹 防雨罩 & 冰镐环</li>
        <li>🔹 人体工学肩带</li>
      </ul>

      <div class="price-row">
        <span class="current-price">¥980</span>
        <span class="original-price">¥1225</span>
      </div>

      <button class="cta-btn" id="addToCartBtn">加入远征清单</button>
      <p class="stock-note" id="stockMsg">现货 — 快速发货</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
