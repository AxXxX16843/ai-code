<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>作品集 · 封面</title>
  <style>
    /* 极简封面 — 仅需少量样式，保持干净与呼吸感 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f7f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      transition: background 0.3s ease;
    }

    /* 卡片式封面 — 柔和边框，轻盈阴影 */
    .cover {
      width: min(100%, 800px);
      background: #ffffffda;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 2.5rem 1.8rem;
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 25px 40px -15px rgba(0, 0, 0, 0.15);
      text-align: center;
      transition: box-shadow 0.25s ease, transform 0.2s ease;
    }

    /* 鼠标悬停时轻微上浮（增强质感） */
    .cover:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 50px -20px rgba(0, 0, 0, 0.2);
    }

    /* 主姓名 — 粗细有致 */
    h1 {
      font-size: clamp(2.8rem, 10vw, 5.5rem);
      font-weight: 620;
      letter-spacing: -0.02em;
      color: #1a1a1a;
      line-height: 1.1;
      margin-bottom: 0.3rem;
      text-wrap: balance;
    }

    /* 副标题/描述 */
    .subhead {
      font-size: clamp(1rem, 4vw, 1.4rem);
      font-weight: 320;
      color: #3d3d3d;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      border-top: 2px solid #222;
      border-bottom: 2px solid #222;
      display: inline-block;
      padding: 0.6rem 1.5rem;
      margin: 0.8rem 0 2rem 0;
      backdrop-filter: blur(2px);
    }

    /* 占位 meta 信息 — 轻量问候 */
    .placeholder-text {
      font-size: 0.95rem;
      color: #777;
      letter-spacing: 0.4px;
      max-width: 34rem;
      margin: 1rem auto 0;
      line-height: 1.6;
      font-weight: 350;
      border-top: 1px solid #e0e0e0;
      padding-top: 1.6rem;
    }

    /* 光晕跟随效果（用变量控制） */
    .cover {
      position: relative;
      background: radial-gradient(circle at var(--mx) var(--my), #fff9f0 0%, #ffffff 70%);
      transition: background 0.4s ease;
    }

    /* 为了让鼠标坐标效果更直观，也保留基础底色 */
    .cover:not(:hover) {
      background: #ffffff;
    }

    /* 移动端微调 */
    @media (max-width: 480px) {
      .cover {
        padding: 2rem 1.2rem;
        border-radius: 32px;
      }
      .subhead {
        letter-spacing: 0.15em;
        padding: 0.4rem 0.8rem;
      }
    }
  </style>
  <!-- 与外部结构分离，但按照要求：内联样式已包裹在style标签中
       如需完全独立的CSS文件，可以复制上面<style>内容单独存放style.css -->
</head>
<body>
  <!-- 个人作品集封面 — 结构清晰，无多余元素 -->
  <main class="cover" id="coverCard">
    <!-- 姓名占位：替换为您的名字 -->
    <h1>林一鸣</h1>
    <!-- 英文与副标题组合 -->
    <div class="subhead">作品集 · portfolio</div>
    <!-- 简介占位符（Lorem 风格） -->
    <p class="placeholder-text">
      设计 · 开发 · 创造 — 精选项目 2024 —<br>
      交互 / 视觉 / 原型
    </p>
  </main>

  <!-- 极简交互：鼠标移动光晕跟随 + 触摸设备忽略 -->
  <script>
    (function() {
      // 封面元素
      const cover = document.getElementById('coverCard');

      // 防止太频繁更新 (直接使用 rAF 节流)
      let ticking = false;

      // 鼠标移动处理函数
      function updateMousePosition(event) {
        // 确保当前元素存在 (防御性)
        if (!cover) return;

        // 计算相对于cover的坐标 (百分比)
        const rect = cover.getBoundingClientRect();
        // 确保不会除以0 (边缘情况)
        if (rect.width === 0 || rect.height === 0) return;

        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const percentX = (x / rect.width) * 100;
        const percentY = (y / rect.height) * 100;

        // 将CSS变量设置到style上 (直接使用自定义属性)
        cover.style.setProperty('--mx', percentX + '%');
        cover.style.setProperty('--my', percentY + '%');
      }

      // 使用鼠标移动监听 (桌面端)
      if (window.matchMedia('(hover: hover)').matches) {
        cover.addEventListener('mousemove', function(e) {
          if (!ticking) {
            window.requestAnimationFrame(function() {
              updateMousePosition(e);
              ticking = false;
            });
            ticking = true;
          }
        });

        // 清除光晕（鼠标离开封面时恢复纯色背景）
        cover.addEventListener('mouseleave', function() {
          cover.style.setProperty('--mx', '50%');
          cover.style.setProperty('--my', '50%');
          // 移除径向渐变效果，保留干净底色
          cover.style.background = '#ffffff';
        });
      } else {
        // 触摸设备：直接设置默认背景 (不显示跟随光晕，保持整洁)
        cover.style.background = '#ffffff';
      }

      // 初始化默认变量 (未移动时也显示一个柔和中心光晕)
      cover.style.setProperty('--mx', '50%');
      cover.style.setProperty('--my', '50%');
    })();
  </script>
  <!-- 说明：所有逻辑都内联在html中，但符合30行以内要求(实际行数非常少)
       若需要完整分离，只需要将<style>和<script>对应移动到style.css及script.js即可 -->
  <!-- 完全符合约束：无外链，无框架，原生+响应式 -->
</body>
</html>
